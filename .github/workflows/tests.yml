name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Ejecutar linter
        run: npx eslint .

      - name: Verificar tipos
        run: npx tsc --noEmit

      # El umbral mínimo de cobertura (70% branches/functions/lines/statements)
      # está definido en jest.config.js (coverageThreshold). Con --coverage,
      # Jest hace fallar este paso (y por lo tanto el pipeline) si algún
      # proyecto queda por debajo del umbral.
      - name: Ejecutar pruebas con cobertura y verificar umbral mínimo
        run: npx jest --coverage --ci
